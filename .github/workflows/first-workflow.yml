name: second-workflow

on:
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa

jobs:
  lint-job:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: "setup node js in VM"
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: install dependancy
        run: npm ci

      - name: run ESLint in app
        run: npm run lint

  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: "setup node js in VM"
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: install dependancy
        run: npm ci

      - name: run test cases
        run: npm run test -- --watch=false

  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: "setup node js in VM"
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: install dependancy
        run: npm ci

      - name: make Angular build
        run: ng build

      - name: create artifact
        uses: actions/upload-artifact@v6
        with:
          name: angular-build
          path: dist/
          retetion-days: 7
